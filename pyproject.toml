readme = "README.md"
authors = [
    { email = "gavrilov.alikhan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "holidays>=0.105",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
ml-practice = "ml_practice:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
